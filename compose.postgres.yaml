# Uso: docker compose -f compose.postgres.yaml up --build
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: crud_usuarios
      POSTGRES_USER: users_app
      POSTGRES_PASSWORD: local_users_password
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./src/main/resources/schema-postgres.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U users_app -d crud_usuarios"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: users-management-api:local
    environment:
      PORT: "8080"
      DB_TYPE: postgres
      DB_SSL_MODE: DISABLED
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: crud_usuarios
      DB_USERNAME: users_app
      DB_PASSWORD: local_users_password
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Gestion de Usuarios}
      JWT_SECRET: ${JWT_SECRET:-ZGV2ZWxvcG1lbnQtb25seS1qd3Qtc2VjcmV0LW11c3QtYmUtcmVwbGFjZWQ=}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-900}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg-data:
